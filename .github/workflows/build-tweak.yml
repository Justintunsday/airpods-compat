name: Build Tweak

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tweak/**"
      - ".github/workflows/build-tweak.yml"

jobs:
  deb:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          brew install ldid xz || true

      - name: Install Theos
        run: |
          THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks "$THEOS/sdks"
          ls "$THEOS/sdks" | head -5
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build rootless package
        run: |
          make -C tweak package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p dist
          for f in tweak/packages/*.deb; do
            arch="$(basename "$f" .deb | awk -F_ '{print $NF}')"
            cp "$f" "dist/AirPodsCompat-rootless-${arch}.deb"
          done
          ls -la dist/

      - name: Build rootful package
        run: |
          rm -rf tweak/packages
          make -C tweak clean >/dev/null 2>&1 || true
          make -C tweak package FINALPACKAGE=1 \
            THEOS_PACKAGE_ARCH=iphoneos-arm \
            THEOS_PACKAGE_INSTALL_PREFIX=
          for f in tweak/packages/*.deb; do
            arch="$(basename "$f" .deb | awk -F_ '{print $NF}')"
            cp "$f" "dist/AirPodsCompat-rootful-${arch}.deb"
          done
          cat > dist/INSTALL.txt <<'EOF'
AirPodsCompat packages
  AirPodsCompat-rootless-iphoneos-arm64.deb  ->  rootless jailbreaks (Dopamine / ElleKit / roothide), installs to /var/jb
  AirPodsCompat-rootful-iphoneos-arm.deb     ->  rootful jailbreaks (unc0ver / checkra1n / palera1n), installs to /

Install the one that matches your jailbreak with Sileo/Zebra (or: dpkg -i <deb>), then reboot userspace.
Check with: dpkg-deb -f <deb> Architecture
EOF
          ls -la dist/

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: airpodscompat-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
