name: DSC Analysis

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'JSON array of iOS versions to analyze'
        required: true
        default: '["27.0","26.6.2"]'
      build:
        description: "Optional build override (e.g. 24A437) - only when a single version is passed"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "analysis/**"
      - ".github/workflows/dsc-analysis.yml"

jobs:
  dsc:
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions || '["27.0","26.6.2"]') }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install ipsw
        run: |
          brew trust blacktop/tap || true
          brew install blacktop/tap/ipsw || brew install --cask blacktop/tap/ipsw
          ipsw version

      - name: Run DSC analysis (iOS ${{ matrix.version }})
        env:
          OUT: out
          DEVICE: iPhone17,3
        run: |
          bash analysis/run.sh "${{ matrix.version }}" "${{ inputs.build }}"

      - name: Summarize (iOS ${{ matrix.version }})
        if: always()
        run: |
          b="out/$(echo '${{ matrix.version }}' | tr '.' '_')"
          {
            echo "## iOS ${{ matrix.version }}"
            echo ""
            for f in "$b"/str_hits.txt "$b"/dsc_files.txt; do
              [[ -f "$f" ]] || continue
              echo "### $(basename "$f")"
              echo '```'
              head -60 "$f" || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis artifacts (iOS ${{ matrix.version }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsc-analysis-${{ matrix.version }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
