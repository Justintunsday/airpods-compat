name: DSC Analysis

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma separated iOS versions (e.g. 27.0,26.6.2)"
        required: true
        default: "27.0,26.6.2"
      build:
        description: "Optional build override (e.g. 24A437) - only when a single version is passed"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "analysis/**"
      - ".github/workflows/dsc-analysis.yml"

jobs:
  dsc:
    runs-on: macos-15
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          sw_vers
          df -h /

      - name: Install ipsw
        run: |
          brew install blacktop/tap/ipsw
          ipsw version

      - name: Run DSC analysis
        env:
          OUT: out
          DEVICE: iPhone17,3
        run: |
          set -euo pipefail
          bash analysis/run.sh "${{ inputs.versions }}" "${{ inputs.build }}"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## DSC analysis summary"
            echo ""
            for f in out/*/str_hits.txt; do
              [[ -f "$f" ]] || continue
              echo "### $f"
              echo '```'
              head -40 "$f" || true
              echo '```'
            done
            echo "### UARP A3 symbols"
            echo '```'
            for f in out/*/sym_uarp_a3.txt; do
              [[ -f "$f" ]] || continue
              echo "# $f"
              head -60 "$f" || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsc-analysis
          path: out/
          if-no-files-found: warn
          retention-days: 30
