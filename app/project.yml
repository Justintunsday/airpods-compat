name: AirPodsCompat
options:
  bundleIdPrefix: com.justintunsday
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  AirPodsCompat:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justintunsday.airpodscompat.app
        PRODUCT_NAME: AirPodsCompat
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: AirPods Compat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AirPodsCompat-Bridging-Header.h
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  AirPodsCompatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Tests/Tests-Bridging-Header.h
        HEADER_SEARCH_PATHS: Sources
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: AirPodsCompat

schemes:
  AirPodsCompat:
    build:
      targets:
        AirPodsCompat: all
    test:
      config: Debug
      targets:
        - AirPodsCompatTests
